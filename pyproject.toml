[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "evocode"
version = "0.1.0"
description = "A software engineering agent for code repair"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "litellm>=1.108.4",
    "openai>=3.48.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
evocode = "evocode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
